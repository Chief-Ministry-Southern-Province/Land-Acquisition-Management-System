services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: land-acquisition-app:latest
    container_name: land-acquisition-app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      # Anonymous volumes to prevent local dev directories from overriding container vendor/node_modules if desired,
      # or omit if you prefer to share vendor/node_modules between host and container.
      # - /var/www/html/vendor
      # - /var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=land_acquisition
      - DB_USERNAME=dev
      - DB_PASSWORD=devpassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - RUN_MIGRATIONS=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: land-acquisition-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=land_acquisition
      - MYSQL_USER=dev
      - MYSQL_PASSWORD=devpassword
      - MYSQL_RANDOM_ROOT_PASSWORD=true
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dev", "-pdevpassword"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: land-acquisition-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: land-acquisition-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web GUI
      - "1025:1025" # SMTP Port

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
